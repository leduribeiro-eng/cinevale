name: Atualizar Programacao de Cinemas

on:
  schedule:
    - cron: '0 6 * * 4'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar script de atualização
        run: python scraper.py

      - name: Salvar alterações no GitHub
        run: |
          git config --global user.name "Robô CineVale"
          git config --global user.email "robo@github.com"
          git add programacao.json || true
          git commit -m "Atualização semanal da programação [skip ci]" || echo "Sem mudanças"
          git push
